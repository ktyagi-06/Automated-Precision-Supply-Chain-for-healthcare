services:
  - type: web
    name: precision-supply-chain-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: LIVE_MODE            # simulate | ingest | off
        value: simulate
      - key: TICK_SECONDS
        value: "5"
      - key: SIM_MINUTES_PER_TICK # simulated minutes per tick (60 = a day every 2 min)
        value: "60"
      - key: RETRAIN_EVERY_DAYS
        value: "7"
      - key: API_KEY              # protects /api/ingest/*; set a secret in the Render dashboard
        sync: false
